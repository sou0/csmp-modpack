# Smouldered - burnt mobs and players char, pixel by pixel; water washes it off.
# Also editable in game: Mods > Smouldered > Config.

# Master switch.
enabled=true

# Charred skin on mobs and players.
skin=true

# Soot on worn armour.
armor=true

# How much of the armour gets soot compared with the skin (0.0 - 1.0).
armorAmount=0.60

# Your own arms char in first person, with sparks near the hands.
firstPersonArms=true

# Glowing ember pixels right after the fire.
embers=true

# Little orange sparks (cinders) floating off after the fire.
sparks=true

# Players char too (other players, and you in third person).
players=true

# Water (rain, swimming, a splash water bottle) washes the char off at once.
waterWashes=true

# How dark the char is (0.0 = light soot, 1.0 = deep dark brown).
darkness=0.50

# Seconds of burning to reach full char (1 - 60). Lava is three times faster.
secondsToFull=7.00

# Seconds until the char fades back to normal on its own (3 - 600).
fadeSeconds=45.00

# Seconds the embers and sparks keep going after the fire (0 - 30).
emberSeconds=5.00

# How many sparks (0.0 - 2.0).
sparkAmount=1.00

# Mobs never charred: entity ids, comma separated; a whole mod with somemod:*
excluded=

