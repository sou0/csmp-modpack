[General]
	#Base health multiplier applied to every boss of this addon.
	healthMultiplier = 1.0
	#Additional health multiplier per participating player (1.0 = +100% per extra player).
	healthPerPlayerMultiplier = 1.0
	#Base damage multiplier applied to every boss of this addon.
	damageMultiplier = 1.0
	#Seconds a boss cannot be summoned again after it has been defeated.
	respawnCooldownSeconds = 600
	#Whether a boss only drops its loot when the killing blow came from a player. When false, a boss whose last point of health was taken by a summoned ally or a stray mob still pays out.
	singleLootDrop = false
	#Radius in blocks in which players are counted as participants for scaling.
	participationRadius = 64.0
	#Whether a boss fight is announced to all players in range.
	announceBossFight = true
	#Radius in blocks a boss's presence is announced over.
	announceRadius = 96.0
	#Whether summoning a boss consumes one totem. Turn off on servers that want bosses to be repeatable fights at no material cost.
	consumeTotemOnUse = true
	#Radius in blocks within which a second boss of the same type cannot be summoned. Stops the fight being trivialised by stacking copies of the same boss.
	summonPreventRadius = 48.0

[ShadowMonarch]
	#Display name shown on the boss bar. Leave empty to use the localised entity name (entity.tensura_celerity.shadow_monarch), which is what multi-language servers want.
	displayName = ""
	#Base maximum health.
	maxHealth = 8000.0
	#Total existence energy, i.e. maximum EP. This is NOT 15 thousand: it is fifteen million, split evenly between the magicule and aura attributes Tensura actually reads.
	maxEP = 1.5E7
	#Base attack damage. Very high on purpose - this is an endgame boss - but still a real number rather than an instakill, so a well geared player can survive a swing.
	attackDamage = 240.0
	#Base armour; Tensura adds more with the Monarch's EP.
	armour = 48.0
	#Armour toughness, 0 to 20: what keeps armour working against heavy blows.
	armourToughness = 20.0
	#Share of every blow the Monarch actually takes (1.0 = nothing kept off). Holds against blows that ignore armour, such as Tensura's Dead End Rainbow.
	plating = 0.8
	#Base movement speed.
	movementSpeed = 0.36
	#Fraction of maximum health at which the Monarch enters phase two (0.5 = half health).
	phaseTwoThreshold = 0.5
	#Damage multiplier applied while in phase two (1.25 = +25%).
	phaseTwoDamageMultiplier = 1.25
	#Speed multiplier applied while in phase two (1.2 = +20%).
	phaseTwoSpeedMultiplier = 1.2
	#Armour multiplier applied while in phase two (1.5 = +50% defence).
	phaseTwoArmourMultiplier = 1.5
	#Follow range bonus added in phase two, in blocks. The Monarch stops letting a player break line of sight and walk away.
	phaseTwoFollowRange = 32.0
	#How much faster the Monarch swings in phase two, as a multiple of its phase one swing rate (1.6 shortens vanilla's 20 tick swing cycle to 13). This really does end the melee goal's cycle early - it is not a tooltip number.
	phaseTwoAttackSpeedMultiplier = 1.6
	#Maximum EP reached in phase two, as a multiple of the phase one pool (2.0 = 15,000,000 -> 30,000,000). Applied exactly once, when phase two begins.
	phaseTwoEpMultiplier = 2.0
	#Phase two ability clock, as a fraction of the phase one interval (0.75 = abilities, slams, steps and skill presses all come off cooldown 25% sooner).
	phaseTwoAbilityIntervalMultiplier = 0.75
	#Seconds between Monarch abilities. Low, because the boss must stay on the offensive even while something else is cooling down.
	abilityIntervalSeconds = 6
	#Damage of a shadow bolt.
	boltDamage = 130.0
	#Number of shadow bolts fired per barrage.
	boltVolley = 4
	#Seconds of Darkness a shadow bolt applies.
	boltDarknessSeconds = 3
	#Damage of the phase two ground slam.
	slamDamage = 200.0
	#Radius in blocks of the phase two ground slam.
	slamRadius = 10.0
	#Seconds between phase two ground slams.
	slamIntervalSeconds = 7
	#Seconds between teleport steps.
	teleportIntervalSeconds = 5
	#Teleport range in blocks.
	teleportRange = 30.0
	#Seconds between presses of the Shadow Monarch Unique Skill during the fight. Each press picks a mode the skill really has.
	skillIntervalSeconds = 12
	#Chance, per boss death, that the Shadow Monarch skill scroll drops. 0.15 = exactly 15%. One roll per death for one item, so the effective chance can never drift above this.
	scrollDropChance = 0.15
	#Seconds the summoning totem is on cooldown.
	summonItemCooldown = 3600
	#The boss's own Shadow Soldier roster, one rank key per soldier. Keys come from the existing rank ladder (e_rank .. monarch_guard); repeat a key to field two of that rank. This is deliberately a high-level mix rather than a wall of monarch_guard.
	armyRanks = ["s_rank", "s_rank", "elite", "elite", "knight", "knight", "elite_knight", "commander", "marshal", "monarch_guard"]
	#Entity types the roster's bodies wear, cycled in order. Any PathfinderMob id works; these read as a shadow host and are all vanilla, so nothing here can break if an addon is absent.
	armyBodies = ["minecraft:wither_skeleton", "minecraft:vindicator", "minecraft:evoker", "minecraft:zombie", "minecraft:stray", "minecraft:blaze"]
	#Existence energy each boss soldier starts with at rank one; it grows along the normal rank ladder, so a monarch_guard is worth far more than an elite. Boss soldiers use the same rank/EP/XP record as player shadows - this only seeds where they begin.
	soldierBaseEp = 100000.0
	#Soldiers raised by a single press of the summon mode or a single re-raise wave.
	armyWaveSize = 3
	#Seconds between automatic re-raises of fallen soldiers.
	armyRaiseIntervalSeconds = 45
	#Seconds the summon skill mode spends on cooldown for the boss.
	armySummonCooldownSeconds = 30
	#Radius in blocks around the boss a raised soldier appears in.
	armySpawnRadius = 7.0
	#The roster rebuilt the moment phase two begins: the same rank ladder, but weighted to the top. Empty falls back to armyRanks. The phase one roster is dissolved and replaced, so the second wave is a genuinely different army rather than more of the same.
	phaseTwoArmyRanks = ["elite_knight", "elite_knight", "elite_knight", "commander", "commander", "commander", "marshal", "marshal", "monarch_guard", "monarch_guard"]
	#Soldiers raised in one go when phase two begins.
	phaseTwoArmyWaveSize = 6
	#EP multiplier given to each phase two soldier when its record is built (1.5 = +50% of the EP its rank already earned). Applied once, while the record is created, so re-raising a body can never stack it.
	phaseTwoSoldierEpMultiplier = 1.5
	#Loot lines, each formatted as item;min;max;chance. The skill scroll is NOT here - it is rolled separately by scrollDropChance.
	drops = ["tensura_celerity:void_heart;1;2;1.0", "tensura_celerity:eclipse_shard;1;2;1.0", "tensura_celerity:temporal_gear;1;2;1.0", "tensura_celerity:monarch_sigil;2;4;1.0", "tensura_celerity:monarch_crest;1;1;0.40", "tensura_celerity:shadow_soul;4;7;1.0", "tensura_celerity:shadow_steel_ingot;8;14;1.0", "minecraft:experience_bottle;8;20;1.0"]

