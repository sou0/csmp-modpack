["Configs for Adams Ars Plus"]
	#does the domain glyph have a cooldown burnout?
	doDomainBurnout = true
	#does the spell efficiency glyph inflict mana exhaustion?
	doDiscountBacklash = true
	#maximum number of times spell efficiency can appear
	# Default: 5
	# Range: 0 ~ 10
	maxDiscount = 5
	#maximum number of entities a domain can target every spell cast
	# Default: 10
	# Range: 1 ~ 100
	maxDomainEntities = 10
	#include community spells for the mysterious mage entity?
	doComMages = true
	#access pool of possible mage spells from local device (true) or online file (false)?
	doLocalMagePool = true
	#Allow overworld mages that can mobgrief?
	doMageGrief = true
	#Have a cooldown on the leap glyph?
	doLeapFatigue = false
	#Dimensions where mages will not spawn. Ex: ["minecraft:overworld", "undergarden:undergarden"]. . Run /forge dimensions for a list.
	dimensionBlacklist = []

["Mage Summon Ritual"]
	#Allow enough matching elemental eyes to bypass the nearby archmage structure requirement.
	#When false, the matching structure is always required regardless of eye count.
	allowStructureBypass = true
	#Total matching elemental eyes consumed to bypass the structure requirement.
	#Applies to Flame, Frost, Earth, Lightning, Holy and Void eyes. Different eye types do not combine.
	# Default: 12
	# Range: > 1
	structureBypassEyes = 12

