[Selina]
	#How much stronger than their rank a Hunter is after each of Selina's three stages, measured from the rank itself. These are totals, not steps: after Stage II a Hunter is 20% above their rank, not 10% and then 20% on top of that. The bonus raises the EP ceiling, the innate EP floor, the rank's health, attack and spiritual health bonuses, and the power of the Hunter's Specialization techniques.
	stageOneBonus = 0.1
	stageTwoBonus = 0.2
	stageThreeBonus = 0.3
	#Stellar Gold Coins (tensura:stellar_gold_coin) each stage costs. Tensura's dwarf merchants trade one for 100 Gold Coins.
	pricePerStage = 1
	#Whether Selina appears in the world at all. Off: no new Selina is ever created (existing ones stay).
	spawnEnabled = true
	#Chance that a villager created by one of the eligible spawn types below is Selina instead. 0.0001 = one in ten thousand. Rolled once, when the villager is created - never again when its chunk is loaded.
	spawnChance = 1.0E-4
	#Which ways of creating a villager may produce Selina, by Minecraft's spawn type name. STRUCTURE is how a village's villagers are placed when the village generates, and in vanilla it is the only natural source of villagers. Breeding (BREEDING), spawn eggs (SPAWN_EGG, DISPENSER), commands (COMMAND), curing (CONVERSION) and spawners are excluded by default.
	eligibleSpawnTypes = ["STRUCTURE", "NATURAL", "CHUNK_GENERATION"]
	#How close (blocks) a Hunter has to stand to Selina to talk to her or buy from her.
	interactionRange = 6.0

#Choosing and changing a Specialization, and how its techniques unlock.
[Specializations]
	#Stellar Gold Coins it costs to change to a different Specialization. The first choice is free. 0 makes changing free.
	changeCost = 2
	#Minutes of play (game time) that must pass after choosing before a Hunter may change again.
	changeCooldownMinutes = 60
	#Mastery of a Specialization's techniques at which its second, third and fourth techniques open. The fourth needs the skill mastered (Tensura's Extra Skill mastery, 500 by default) whatever is set here, if this is higher.
	tierTwoMastery = 100
	tierThreeMastery = 250
	tierFourMastery = 500
	#Mastery points given for each act the Specialization is about (a backstab, a blow taken while protecting, a spell landed), on top of what Tensura gives for using a technique. At most once per this many ticks.
	roleMastery = 1.0
	roleMasteryIntervalTicks = 40

