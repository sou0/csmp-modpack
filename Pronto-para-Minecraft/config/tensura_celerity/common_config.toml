#Enables the addon's /celerity command tree (shadow army management, evolution and skill evolution inspection).
enableCommands = true
#Broadcast a chat message to the whole server when a player unlocks an Ultimate Skill.
announceUltimateUnlock = true
#Offer the Hunter and Player races in Tensura's reincarnation menu. While this is on, Celerity writes their two ids into Tensura's reincarnation_config.toml (and nothing else); turning it off takes them out again.
allowRaceSelection = true
#Give each player the System's Primer, a short guide book to the addon, the first time they join (/primer gives it again).
givePrimerOnFirstJoin = true
#Whether bosses spawned by this addon use the scaled difficulty formula instead of raw values.
scaleBossDifficulty = true
#Maximum number of players that may fight the same addon boss at once before its health stops scaling.
bossMaxScalingPlayers = 4
#Amount of log verbosity: 0 = errors only, 1 = warnings, 2 = info, 3 = debug.
logLevel = 1
