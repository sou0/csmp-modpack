[Growth]
	#Whether the Unique Skills' damage grows with the wielder's EP. Only a player's: the skill bosses carry their own figures.
	enabled = true
	#The damage of a Unique Skill is multiplied by 1 + sqrt(EP) / divisor. At the default 200: x1.5 at 10,000 EP, x2.6 at 100,000, x6 at a million, x16.8 at ten million.
	divisor = 200.0
	#The most that growth can multiply a Unique Skill's damage by.
	cap = 25.0

[BlossomStorm]
	#Magicule it costs.
	cost = 260.0
	#Seconds before it can be used again.
	cooldown = 22
	#Its damage, before the wielder's EP grows it.
	damage = 8.0
	#How far it reaches, in blocks: its radius or its length.
	reach = 5.5

