plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '0.1.0'
group = 'br.csmp'

base { archivesName = 'csmp-core' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.266'

    runs {
        client { client() }
        server { server() }
    }

    mods {
        csmp { sourceSet sourceSets.main }
    }
}

dependencies {
    // Create: Skys so para compilar (nao e empacotado no nosso jar)
    compileOnly files('../Pack-Direto/mods/createsky-0.1.2.jar')
    // Simple Voice Chat: so a API (esta dentro do jar do mod) para compilar; nao e empacotada no nosso jar
    compileOnly files('../Pack-Direto/mods/voicechat-neoforge-1.21.1-2.6.27.jar')
    // Create: Atmospherics (MIT): so para avisar o cache da costa quando um bloco muda
    compileOnly files('../Pack-Direto/mods/create_atmospherics-2.1.0.jar')
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }