basin=true
cask=true
chopping_block=true
cooking_pot=true
cooking_pot_time=1.0
cuisine_board=true
cutting_board=true
ed_vat=true
grill=true
keg=true
kettle=true
kettle_time=1.0
melting_pot=true
mixing_bowl=true
oven=true
recipe_book=true
remove_crafting_recipes=true
skillet=true
